# Alembic 配置:应用库 mem0_app 的 schema 迁移。
# per-product 库由代码运行时按需建库建表(schema 自愈),不进 Alembic。
[alembic]
# %(here)s = alembic.ini 所在目录的绝对路径,无论从哪个 cwd 运行都能定位
script_location = %(here)s/alembic
# 把仓库根(mem0_official)加入 sys.path,使 env.py 能 import ksc_mem0_server
prepend_sys_path = %(here)s/..
version_path_separator = os
# env.py 会用环境变量覆盖此 URL,这里仅占位
sqlalchemy.url = postgresql+psycopg://postgres:postgres@localhost:5433/mem0_app

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
